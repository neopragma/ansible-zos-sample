---
- name: Allocate two sequential data sets

  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  vars:
    hlq: "{{ userid }}"
    data_sets:
      - filename: "{{ hlq }}.SAMP.SEQ1"
        primary_allocation: 2
        secondary_allocation: 4
      - filename: "{{ hlq }}.SAMP.SEQ2"
        primary_allocation: 5
        secondary_allocation: 5

  tasks:

    - ansible.builtin.assert:
        that: hlq is defined
        fail_msg: 'The z/OS userid must be passed on the command line: ansible-playbook blah -e "userid=value"' 

    - name: Allocate data sets
      ansible.builtin.include_role:
        name: allocate_sequential_data_set
      vars:
        filename: "{{ item.filename }}"
        primary_allocation: "{{ item.primary_allocation }}"
        secondary_allocation: "{{ item.secondary_allocation }}"
        data_set: "{{ item }}"
      loop: "{{ data_sets }}"
      loop_control:
        label: "{{ item.filename }}"
