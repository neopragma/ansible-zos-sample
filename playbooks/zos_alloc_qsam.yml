---
- name: Allocate a QSAM data set
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
    - name: Allocate data set
      ibm.ibm_zos_core.zos_data_set: 
        name: IBMUSER.SAMP.QSAM
        type: seq
        space_primary: 5
        space_secondary: 10
        space_type: trk
        record_format: fb
        record_length: 80
        block_size: 8000
        replace: true
        state: present
      register: result
      
